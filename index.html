<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cryptocurrency Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Navigation -->
        <nav>
            <img src="logo.png" class="logo" alt="Logo">
            <ul>
                <li><a href="#">Market</a></li>
                <li><a href="#">Features</a></li>
                <li><a href="#">White Paper</a></li>
                <li><a href="#">About Us</a></li>
            </ul>
            <a href="#" class="btn">EN</a>
        </nav>

        <!-- Main Content -->
        <div class="content">
            <h1>BUY & <br>SELL <span>Crypto</span></h1>
            <p>World's biggest Cryptocurrency exchange available on web <br>as well as mobile phone.</p>
            <a href="#" class="btn">EXPLORE MORE</a>
        </div>

        <!-- Cryptocurrency Prices -->
        <div class="coin-list">
            <div class="coin">
                <img src="bitcoin.png" alt="Bitcoin">
                <div>
                    <h3>$<span id="bitcoin">--</span></h3>
                    <p>Bitcoin</p>               
                </div>
            </div>

            <div class="coin">
                <img src="ethereum.png" alt="Ethereum">
                <div>
                    <h3>$<span id="ethereum">--</span></h3>
                    <p>Ethereum</p>               
                </div>
            </div>

            <div class="coin">
                <img src="dogecoin.png" alt="Dogecoin">
                <div>
                    <h3>$<span id="dogecoin">--</span></h3>
                    <p>Dogecoin</p>               
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
